name: Firmware installer release

on:
  push:
    branches:
      - ccr-be8a1bcb-5t76j0
      - main
    paths:
      - "esp/**"
      - "tools/**"
      - "data/**"
      - ".github/workflows/firmware-installer.yml"
  workflow_dispatch:

concurrency:
  group: firmware-installer-\${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32-C6
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          cd esp
          idf.py set-target esp32c6
          idf.py build
          idf.py merge-bin -o "$PWD/build/tekla_pellet_flash.bin"
          sha256sum "$PWD/build/tekla_pellet_flash.bin"
      - name: Create manifest
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(sha256sum esp/build/tekla_pellet_flash.bin | awk '{print $1}')
          SIZE=$(stat -c '%s' esp/build/tekla_pellet_flash.bin)
          cat > esp/build/manifest.json <<EOF
          {
            "project": "TeklaPelletCANv2",
            "chip": "ESP32-C6",
            "image": "tekla_pellet_flash.bin",
            "address": "0x000000",
            "erase_all": true,
            "size": $SIZE,
            "sha256": "$SHA",
            "commit": "\${GITHUB_SHA}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
      - name: Publish installer image
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete installer-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create installer-latest \
            esp/build/tekla_pellet_flash.bin esp/build/manifest.json \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TeklaPelletCANv2 — instalator" \
            --notes "Automatycznie zbudowany obraz pierwszego wgrania. Pełne kasowanie flash + zapis od 0x0. Commit: $GITHUB_SHA"
