name: Deploy web installer

on:
  push:
    branches:
      - ccr-be8a1bcb-5t76j0
      - main
    paths:
      - "web_installer/**"
      - ".github/workflows/pages-installer.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-installer-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site
        shell: bash
        run: |
          set -e
          mkdir -p _site/installer
          cp web_installer/index.html _site/installer/index.html
          : > _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
