name: CI
# Oszczednie: tylko zmiany w kodzie/modelu (paths) albo reczny start. Kompilacja ESP-IDF jak w starym projekcie (kontener espressif/idf).
on:
  push:
    paths: ["esp/**", "ui/**", "tools/**", "data/**", "android/**", "ha/**", "analiza/analiza_archiwum/FW2213TK-2026-11-22/data/ui_model/device_model.json", ".github/workflows/ci.yml"]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Model produktowy zgodny ze zrodlem w analiza/
        run: |
          cmp data/device_model.json analiza/analiza_archiwum/FW2213TK-2026-11-22/data/ui_model/device_model.json
          pip install pillow >/dev/null 2>&1; python3 analiza/tools/validate_ui_model.py
      - name: Tabele wygenerowane sa aktualne
        run: |
          python3 tools/gen_esp_tables.py
          git diff --exit-code -- esp/components/tekla_core/gen ui/gen
      - name: Integracja HA - kompilacja Pythona, katalog PID aktualny, skladnia karty
        run: |
          python3 -m compileall -q ha/custom_components/teklapelletcanv2
          python3 tools/gen_ha_catalog.py
          git diff --exit-code -- ha/custom_components/teklapelletcanv2/catalog.json
          node --check ha/custom_components/teklapelletcanv2/www/teklapelletcan-card.js
      - name: Testy rdzenia (natywne)
        run: sh esp/components/tekla_core/test/run.sh
  idf-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Kompilacja ESP-IDF (esp32c6)
        shell: bash
        run: |
          set -o pipefail
          . $IDF_PATH/export.sh
          cd esp
          idf.py set-target esp32c6
          idf.py build 2>&1 | tee /tmp/build.log
          grep -E 'error:|FAILED' /tmp/build.log | head -40 || true
          idf.py merge-bin -o "$PWD/build/tekla_pellet_flash.bin"
          ls -la build/*.bin
      - uses: actions/upload-artifact@v4
        with:
          name: tekla-firmware
          path: |
            esp/build/tekla_pellet.bin
            esp/build/tekla_pellet_flash.bin
            esp/build/partition_table/partition-table.bin
            esp/build/bootloader/bootloader.bin
          retention-days: 14
  publish-beta:
    # Tylko push na galaz 'beta': wydanie GitHub 'beta' z plikiem OTA (zwykly .bin, bez podpisu) - pobiera go modul z konta DEV
    if: github.ref == 'refs/heads/beta'
    needs: idf-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tekla-firmware
          path: art
      - name: Wydanie beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V="beta-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          cp "$(find art -name tekla_pellet.bin | head -1)" tekla_pellet_beta.bin
          printf '{"version":"%s"}' "$V" > beta.json
          gh release delete beta --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create beta tekla_pellet_beta.bin beta.json --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "BETA $V" --notes "Automatyczne wydanie kanalu BETA (OTA z konta DEV)."
  android-shots:
    timeout-minutes: 20
    needs: android-build
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Budowa APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator + zrzuty ekranow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: sh tools/android_shots.sh
      - name: Artefakt zrzutow emulatora
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-proof
          path: docs/zrzuty_android
          retention-days: 7
      - name: Zapis zrzutow w repo (galaz biezaca)
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -f docs/zrzuty_android
          git commit -m "CI: zrzuty ekranow Androida [skip ci]" || exit 0
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Spojnosc zasobow Androida z WWW (app.json, model, ikony)
        run: |
          cmp ui/gen/app.json android/app/src/main/assets/app.json
          cmp ui/gen/model.min.json android/app/src/main/assets/model.min.json
          diff -rq ui/assets/ic android/app/src/main/assets/ic
      - name: Kompilacja aplikacji (debug APK)
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tekla-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
