name: CI
# Oszczednie: tylko zmiany w kodzie/modelu (paths) albo reczny start. Kompilacja ESP-IDF jak w starym projekcie (kontener espressif/idf).
on:
  push:
    paths: ["esp/**", "ui/**", "tools/**", "data/**", "android/**", ".github/workflows/ci.yml"]
  workflow_dispatch:
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tabele wygenerowane sa aktualne
        run: |
          python3 tools/gen_esp_tables.py
          git diff --exit-code -- esp/components/tekla_core/gen ui/gen
      - name: Testy rdzenia (natywne) + paczka UI
        run: sh esp/components/tekla_core/test/run.sh
  idf-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Paczka UI
        run: python3 tools/pack_ui.py ui/ui_pack.bin
      - name: Kompilacja ESP-IDF (esp32c6)
        shell: bash
        run: |
          set -o pipefail
          . $IDF_PATH/export.sh
          cd esp
          idf.py set-target esp32c6
          idf.py build 2>&1 | tee /tmp/build.log
          grep -E 'error:|FAILED' /tmp/build.log | head -40 || true
          ls -la build/*.bin
      - uses: actions/upload-artifact@v4
        with:
          name: tekla-firmware
          path: |
            esp/build/tekla_pellet.bin
            esp/build/partition_table/partition-table.bin
            esp/build/bootloader/bootloader.bin
            ui/ui_pack.bin
          retention-days: 14
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Spojnosc zasobow Androida z WWW (app.json, model, ikony)
        run: |
          cmp ui/gen/app.json android/app/src/main/assets/app.json
          cmp ui/gen/model.min.json android/app/src/main/assets/model.min.json
          diff -rq ui/assets/ic android/app/src/main/assets/ic
      - name: Kompilacja aplikacji (debug APK)
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tekla-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
